<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>{{ category }}</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

<style>

body{
background:#f5f7fa;
}

.card{
border:none;
border-radius:15px;
transition:.3s;
}

.card:hover{
transform:translateY(-8px);
box-shadow:0 12px 25px rgba(0,0,0,.2);
}

</style>

<script>

function searchService(){

let input=document.getElementById("search").value.toUpperCase();

let cards=document.getElementsByClassName("service-card");

for(let i=0;i<cards.length;i++){

let txt=cards[i].innerText;

if(txt.toUpperCase().indexOf(input)>-1){

cards[i].style.display="block";

}

else{

cards[i].style.display="none";

}

}

}

</script>

</head>

<body>

<nav class="navbar navbar-dark bg-primary">

<div class="container">

<a class="navbar-brand fw-bold" href="/">

🌐 OmniEntry AI

</a>

<a href="/" class="btn btn-light">

🏠 Home

</a>

</div>

</nav>

<div class="container mt-5">

<h2 class="text-center fw-bold mb-4">

📂 {{ category }}

</h2>

<div class="row justify-content-center mb-4">

<div class="col-md-6">

<input

type="text"

id="search"

class="form-control"

placeholder="Search Service..."

onkeyup="searchService()">

</div>

</div>

<div class="row">

{% if services %}

{% for service in services %}

<div class="col-lg-4 col-md-6 mb-4 service-card">

<div class="card shadow h-100">

<div class="card-body text-center">

<h1>📄</h1>

<h4>

{{ service['service_name'] }}

</h4>

<p class="text-muted">

{{ service['category_name'] }}

</p>

<a

href="/service/{{ service['id'] }}"

class="btn btn-success">

View Details

</a>

</div>

</div>

</div>

{% endfor %}

{% else %}

<div class="col-12">

<div class="alert alert-danger text-center">

<h3>

❌ No Services Found

</h3>

</div>

</div>

{% endif %}

</div>

<div class="text-center mt-4">

<a href="/" class="btn btn-primary btn-lg">

⬅ Back to Home

</a>

</div>

</div>

<footer class="bg-dark text-white text-center p-4 mt-5">

<h5>

🌐 OmniEntry AI

</h5>

<p>

Government Service Recommendation Portal

</p>

</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
