<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>OmniEntry AI Assistant</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
background:#eef4ff;
font-family:Segoe UI;
}

.chat-box{
height:450px;
overflow-y:auto;
border:1px solid #ddd;
border-radius:15px;
padding:20px;
background:white;
}

.user{
text-align:right;
margin:10px;
}

.bot{
text-align:left;
margin:10px;
}

.user span{
background:#0d6efd;
color:white;
padding:10px 15px;
border-radius:15px;
display:inline-block;
}

.bot span{
background:#f1f1f1;
padding:10px 15px;
border-radius:15px;
display:inline-block;
}

</style>

</head>

<body>

<div class="container mt-5">

<h2 class="text-center text-primary">

🤖 OmniEntry AI Government Assistant

</h2>

<div class="chat-box mt-4" id="chat">

<div class="bot">

<span>

Hello 👋<br><br>

I can help you with:

✅ Passport

✅ Aadhaar

✅ PAN Card

✅ Driving Licence

✅ Scholarships

✅ Banking

✅ Agriculture

✅ Certificates

Ask me anything.

</span>

</div>

</div>

<div class="input-group mt-3">

<input
type="text"
id="message"
class="form-control"
placeholder="Ask your question...">

<button
class="btn btn-primary"
onclick="sendMessage()">

Send

</button>

</div>

<br>

<a href="/" class="btn btn-success">

⬅ Back to Home

</a>

</div>

<script>

function sendMessage(){

let msg=document.getElementById("message").value;

if(msg=="") return;

let chat=document.getElementById("chat");

chat.innerHTML+=`
<div class="user">
<span>${msg}</span>
</div>
`;

let reply="Sorry, I don't understand.";

msg=msg.toLowerCase();

if(msg.includes("passport"))
reply="You can apply for Passport from Passport Category.";

else if(msg.includes("aadhaar"))
reply="Open Aadhaar Category to update or create Aadhaar.";

else if(msg.includes("pan"))
reply="PAN Card services are available under PAN Card Category.";

else if(msg.includes("driving"))
reply="Driving Licence services are available under Driving Licence.";

else if(msg.includes("scholar"))
reply="Scholarships are available under Scholarship Category.";

else if(msg.includes("job"))
reply="Visit Jobs Category for SSC, UPSC, Banking and Railway Jobs.";

else if(msg.includes("bank"))
reply="Banking Category contains Loan, Account and PM Jan Dhan.";

else if(msg.includes("certificate"))
reply="Income, Caste, Birth and Residence Certificates are available.";

else if(msg.includes("agriculture"))
reply="PM Kisan, Crop Insurance and Soil Health Card are available.";

chat.innerHTML+=`
<div class="bot">
<span>${reply}</span>
</div>
`;

document.getElementById("message").value="";

chat.scrollTop=chat.scrollHeight;

}

</script>

</body>

</html>
