<!DOCTYPE html>
<html>
<head>
    <title>OmniEntry AI Dashboard</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

<h2 class="text-center mb-4">
📊 OmniEntry AI Analytics Dashboard
</h2>

<div class="row">

<div class="col-md-6">
<canvas id="categoryChart"></canvas>
</div>

<div class="col-md-6">
<canvas id="serviceChart"></canvas>
</div>

</div>

<br>

<a href="/" class="btn btn-primary">
🏠 Back Home
</a>

</div>

<script>

new Chart(document.getElementById("categoryChart"),{

type:'bar',

data:{
labels:['Education','Jobs','Banking','Health','Travel','Business'],
datasets:[{
label:'Categories',
data:[10,12,8,6,5,7]
}]
}

});

new Chart(document.getElementById("serviceChart"),{

type:'pie',

data:{
labels:['Education','Jobs','Banking','Health'],
datasets:[{
data:[30,25,20,25]
}]
}

});

</script>

</body>
</html>
