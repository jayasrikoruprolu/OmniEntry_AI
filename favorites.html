<!DOCTYPE html>
<html>

<head>

<title>Favorite Services</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-primary">

<div class="container">

<a class="navbar-brand" href="/">🌐 OmniEntry AI</a>

<a href="/" class="btn btn-light">Home</a>

</div>

</nav>

<div class="container mt-5">

<h2 class="mb-4">❤️ My Favorite Services</h2>

<div class="row">

{% if services %}

{% for service in services %}

<div class="col-md-4 mb-4">

<div class="card shadow">

<div class="card-body">

<h5>{{ service['service_name'] }}</h5>

<p>{{ service['category_name'] }}</p>

<a href="/service/{{ service['id'] }}" class="btn btn-primary">

View

</a>

</div>

</div>

</div>

{% endfor %}

{% else %}

<h4>No Favorite Services Found.</h4>

{% endif %}

</div>

</div>

</body>

</html>
