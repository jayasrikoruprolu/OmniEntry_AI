<!DOCTYPE html>
<html>
<head>

<title>Feedback</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

<div class="card shadow-lg">

<div class="card-header bg-success text-white">

<h2>💬 Feedback</h2>

</div>

<div class="card-body">

<form method="POST">

<div class="mb-3">

<label>Name</label>

<input type="text"
name="name"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Email</label>

<input type="email"
name="email"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Message</label>

<textarea
name="message"
class="form-control"
rows="5"
required></textarea>

</div>

<button class="btn btn-success">

Submit Feedback

</button>

<a href="/"
class="btn btn-secondary">

Home

</a>

</form>

</div>

</div>

</div>

</body>
</html>
